<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* ---- light theme (default): black text on a near-opaque light panel ----
     The page paints its own background rather than relying on the blur behind
     it, so text contrast is guaranteed whatever is on screen underneath. ---- */
  :root{
    --panel: rgba(250,250,252,.97);
    --fg:    #000;
    --fg2:   rgba(0,0,0,.68);
    --fg3:   rgba(0,0,0,.50);
    --line:  rgba(0,0,0,.11);
    --track: rgba(0,0,0,.13);
    --hover: rgba(0,0,0,.06);
    --idle:  rgba(0,0,0,.30);
    --busy:  #c26a00;
    --done:  #12833f;
    --fail:  #c62828;
    --bannerBg:  rgba(18,131,63,.13);
    --bannerLine:rgba(18,131,63,.40);
  }
  body.dark{
    --panel: rgba(28,28,30,.97);
    --fg:    #fff;
    --fg2:   rgba(255,255,255,.62);
    --fg3:   rgba(255,255,255,.42);
    --line:  rgba(255,255,255,.10);
    --track: rgba(255,255,255,.13);
    --hover: rgba(255,255,255,.07);
    --idle:  rgba(255,255,255,.30);
    --busy:  #ffb84d;
    --done:  #3ddc84;
    --fail:  #ff6b6b;
    --bannerBg:  rgba(61,220,132,.14);
    --bannerLine:rgba(61,220,132,.34);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{background:transparent;overflow:hidden}
  body{
    background:var(--panel);
    overflow:hidden;
    font:12px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    color:var(--fg);
    -webkit-font-smoothing:antialiased;
    user-select:none; cursor:default;
  }
  .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;
        font-variant-numeric:tabular-nums}

  /* ---------- title bar ---------- */
  #bar{display:flex;align-items:center;gap:7px;padding:9px 10px 8px;
       border-bottom:1px solid var(--line)}
  body.min #bar{border-bottom:none}
  #bar .dot{width:7px;height:7px;border-radius:50%;background:var(--idle);
            flex:none;transition:background .3s}
  #bar .dot.live{background:var(--busy);box-shadow:0 0 7px var(--busy)}
  #tally{margin-left:auto;font-size:11px;color:var(--fg2);white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis;min-width:0}
  #tally b{color:var(--busy);font-weight:700}
  #tally b.wait{color:var(--fail)}
  #minstat{display:none;font-size:10.5px;color:var(--fg3);white-space:nowrap}
  body.min #minstat{display:inline}
  .btns{display:flex;gap:2px;flex:none;margin-left:4px}
  .xbtn{color:var(--fg2);font-size:13px;font-weight:600;line-height:1;
        padding:4px 5px;border-radius:5px;cursor:default;background:var(--hover)}
  .xbtn:hover{color:var(--fg);background:var(--track)}
  /* unread counter: finished sessions you haven't acknowledged yet */
  #badge{display:none;align-items:center;flex:none;padding:2px 7px;
         border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.03em;
         background:var(--done);color:#fff;margin-left:6px}
  #badge.on{display:inline-flex}


  /* ---------- pixel companion ----------
     11x7 grid: torso, two arms, four legs, two eyes. Animated per state so a
     glance at the title bar tells you whether anything is actually working. */
  .ch{width:30px;height:auto;flex:none;overflow:visible;
      transform-origin:center bottom}
  .ch rect{shape-rendering:crispEdges}
  .ch .skin{fill:#c4795a}
  .ch .eye{fill:#1a1a1a}
  body.dark .ch .skin{fill:#d98764}

  /* working: bobbing and flapping */
  .ch.work{animation:chDance .62s ease-in-out infinite}
  .ch.work .arm-l{animation:chArmL .31s ease-in-out infinite}
  .ch.work .arm-r{animation:chArmR .31s ease-in-out infinite}
  @keyframes chDance{
    0%,100%{transform:translateY(0) rotate(-7deg)}
    25%    {transform:translateY(-3px) rotate(0deg)}
    50%    {transform:translateY(0) rotate(7deg)}
    75%    {transform:translateY(-3px) rotate(0deg)}
  }
  @keyframes chArmL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-30deg)}}
  @keyframes chArmR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(30deg)}}

  /* resting: slow breathing, occasional blink */
  .ch.rest{animation:chBreathe 3.4s ease-in-out infinite}
  .ch.rest .eyes{animation:chBlink 4.6s ease-in-out infinite}
  @keyframes chBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
  @keyframes chBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

  /* waiting on you: waves and hops, with a marker over its head */
  .ch.wait{animation:chHop .8s ease-in-out infinite}
  .ch.wait .arm-r{animation:chWave .4s ease-in-out infinite}
  .ch.wait .bang{display:block;animation:chBang .8s ease-in-out infinite}
  @keyframes chHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}}
  @keyframes chWave{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-65deg)}}
  @keyframes chBang{0%,100%{opacity:1}50%{opacity:.25}}
  .ch .bang{display:none;fill:var(--fail)}
  .ch .arm-l{transform-origin:2px 3px}
  .ch .arm-r{transform-origin:9px 3px}
  .ch .eyes{transform-origin:5.5px 1.5px}

  /* a session blocked on you outranks everything else */
  .row.waiting{background:rgba(194,106,0,.14)}
  body.dark .row.waiting{background:rgba(255,184,77,.14)}
  .row.waiting .st{background:var(--busy);animation:chBang .8s ease-in-out infinite}
  .row.waiting .nm{color:var(--fg);font-weight:700}
  .row.waiting .meta{color:var(--busy);font-weight:700}

  /* ---------- collapsed (minimised) ---------- */
  body.min .sec,body.min #banner{display:none !important}
  /* minimised still shows the limits — they're the reason to keep it on screen */
  body.min .m.mach{display:none}
  body.min #meters{padding:6px 10px 7px;border-bottom:none}
  body.min .m.gap{margin-top:0;padding-top:0;border-top:none}

  /* ---------- attention flash ----------
     System notifications need a permission the HUD can't grant itself, so the
     panel raises its own alarm: it is always on top anyway. */
  body.alerting{animation:alertPulse .7s ease-in-out 6}
  @keyframes alertPulse{
    0%,100%{box-shadow:inset 0 0 0 0 rgba(198,40,40,0)}
    50%    {box-shadow:inset 0 0 0 3px rgba(198,40,40,.85)}
  }

  /* ---------- finished banner ---------- */
  #banner{display:none;align-items:center;gap:8px;margin:8px 9px 0;
          padding:8px 10px;border-radius:8px;background:var(--bannerBg);
          border:1px solid var(--bannerLine);animation:pop .32s ease-out}
  #banner.on{display:flex}
  @keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  #banner .tick{color:var(--done);font-size:13px;font-weight:800;flex:none}
  #banner .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;
               white-space:nowrap}
  #banner .go{margin-left:auto;flex:none;font-size:10px;color:var(--done);
              letter-spacing:.03em;font-weight:600}

  /* ---------- meters ---------- */
  #meters{padding:9px 10px 10px;display:grid;gap:6px;
          border-bottom:1px solid var(--line)}
  body.compact #meters{padding:7px 8px 8px;gap:5px}
  .m{display:grid;grid-template-columns:50px 1fr 78px;align-items:center;gap:8px}
  body.compact .m{grid-template-columns:42px 1fr 70px;gap:6px}
  .m.gap{margin-top:3px;padding-top:6px;border-top:1px solid var(--line)}
  .m .lbl{font-size:10px;color:var(--fg3);letter-spacing:.05em;
          text-transform:uppercase}
  body.compact .m .lbl{font-size:9px}
  .m .bar{display:block;height:4px;border-radius:3px;background:var(--track);
          overflow:hidden}
  /* .fill must be block: as an inline child of .bar, width/height are ignored */
  .m .fill{display:block;height:100%;width:0;border-radius:3px;
           transition:width .45s ease,background-color .45s}
  .m .val{font-size:10.5px;color:var(--fg2);text-align:right;white-space:nowrap}
  body.compact .m .val{font-size:9.5px}
  .m .val em{font-style:normal;color:var(--fg);font-weight:600}

  /* ---------- sections ---------- */
  .sec{border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:none}
  .hd{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
  body.compact .hd{padding:6px 8px 5px}
  .hd:hover{background:var(--hover)}
  .hd .nm{font-size:9.5px;font-weight:700;letter-spacing:.1em;
          text-transform:uppercase;color:var(--fg3)}
  .hd .sub{margin-left:auto;font-size:10px;color:var(--fg3)}
  .hd .sub .warn{color:var(--fail);font-weight:600}
  .hd .car{font-size:8px;color:var(--fg3);transition:transform .2s;
           transform:rotate(90deg)}
  .sec.closed .car{transform:rotate(0deg)}
  .sec.closed .body{display:none}
  /* lists scroll internally so the panel never outgrows the screen */
  .body{padding:0 5px 7px;overflow-y:auto;overscroll-behavior:contain}
  #list-s{max-height:250px}
  #list-j{max-height:170px}
  body.compact #list-s{max-height:190px}
  body.compact #list-j{max-height:120px}
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
  .body::-webkit-scrollbar-track{background:transparent}

  /* ---------- rows ---------- */
  .row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px}
  body.compact .row{padding:3px 5px;gap:6px}
  .row:hover{background:var(--hover)}
  .row .st{width:6px;height:6px;border-radius:50%;flex:none;background:var(--idle)}
  .row.busy .st{background:var(--busy);animation:breathe 1.5s ease-in-out infinite}
  .row.done .st{background:var(--done);box-shadow:0 0 6px var(--done)}
  .row.fail .st{background:var(--fail)}
  .row.run  .st{background:var(--done)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
           font-size:11.5px;color:var(--fg2)}
  body.compact .row .nm{font-size:10.5px}
  .row.busy .nm,.row.done .nm{color:var(--fg);font-weight:600}
  .row .meta{flex:none;font-size:10px;color:var(--fg3)}
  body.compact .row .meta{font-size:9.5px}
  .row.busy .meta{color:var(--busy);font-weight:600}
  .row.done .meta{color:var(--done);font-weight:600}
  .row.fail .meta{color:var(--fail);font-weight:600}
  /* unacknowledged finish: stays marked until you click the row */
  .row.unread{background:var(--bannerBg)}
  .row.unread .nm{color:var(--fg);font-weight:700}
  .row .new{display:none;flex:none;font-size:8.5px;font-weight:800;
            letter-spacing:.06em;padding:1px 5px;border-radius:8px;
            background:var(--done);color:#fff}
  .row.unread .new{display:inline-block}
  .row .tty{flex:none;font-size:9.5px;color:var(--fg3);opacity:.8;min-width:34px;
            text-align:right}
  .row .mem{flex:none;font-size:10px;color:var(--fg2);min-width:40px;
            text-align:right;font-weight:600}
  .row.heavy .mem{color:var(--fail)}
  body.compact .row .tty{display:none}
  .row.click:active{background:var(--track)}
  .empty{padding:8px 12px;font-size:10.5px;color:var(--fg3);font-style:italic}
</style>
</head>
<body>

<div id="bar">
  <svg class="ch rest" id="ch" viewBox="0 0 11 7">
    <g class="ch-body">
      <rect class="skin" x="2" y="0" width="7" height="5"/>
      <rect class="skin" x="2" y="5" width="1" height="2"/>
      <rect class="skin" x="4" y="5" width="1" height="2"/>
      <rect class="skin" x="6" y="5" width="1" height="2"/>
      <rect class="skin" x="8" y="5" width="1" height="2"/>
      <g class="eyes">
        <rect class="eye" x="3" y="1" width="1" height="1"/>
        <rect class="eye" x="7" y="1" width="1" height="1"/>
      </g>
    </g>
    <rect class="skin arm-l" x="0" y="2" width="2" height="2"/>
    <rect class="skin arm-r" x="9" y="2" width="2" height="2"/>
    <rect class="bang" x="5" y="-2.4" width="1" height="1.6"/>
  </svg>
  <span id="tally">—</span>
  <span id="minstat"></span>
  <span id="badge" title="Finished but not opened yet — click to clear"></span>
  <span class="btns">
    <span class="xbtn" id="b-theme" title="Light / dark">◐</span>
    <span class="xbtn" id="b-size"  title="Compact size">⤢</span>
    <span class="xbtn" id="b-min"   title="Minimise">–</span>
    <span class="xbtn" id="b-quit"  title="Quit">✕</span>
  </span>
</div>

<div id="banner">
  <span class="tick">✓</span>
  <span class="who" id="bwho"></span>
  <span class="go">JUMP →</span>
</div>

<div id="meters">
  <div class="m mach"><span class="lbl">CPU</span>
    <span class="bar"><span class="fill" id="f-cpu"></span></span>
    <span class="val" id="v-cpu">—</span></div>
  <div class="m mach"><span class="lbl">RAM</span>
    <span class="bar"><span class="fill" id="f-mem"></span></span>
    <span class="val" id="v-mem">—</span></div>
  <div class="m gap"><span class="lbl">Session</span>
    <span class="bar"><span class="fill" id="f-ses"></span></span>
    <span class="val" id="v-ses">—</span></div>
  <div class="m"><span class="lbl">Weekly</span>
    <span class="bar"><span class="fill" id="f-wk"></span></span>
    <span class="val" id="v-wk">—</span></div>
</div>

<div class="sec" id="sec-s">
  <div class="hd"><span class="car">▶</span><span class="nm">Sessions</span>
    <span class="sub" id="sub-s"></span></div>
  <div class="body" id="list-s"></div>
</div>

<div class="sec" id="sec-j">
  <div class="hd"><span class="car">▶</span><span class="nm">Background</span>
    <span class="sub" id="sub-j"></span></div>
  <div class="body" id="list-j"></div>
</div>

<script>
const send = m => window.webkit.messageHandlers.hud.postMessage(m);
const $ = id => document.getElementById(id);
const body = document.body;

/* ---------- view modes: theme / compact / minimised ---------- */
const MODES = {dark:'hudDark', compact:'hudCompact', min:'hudMin'};
for (const [cls, key] of Object.entries(MODES))
  if (localStorage.getItem(key) === '1') body.classList.add(cls);

function setMode(cls, on){
  body.classList.toggle(cls, on);
  localStorage.setItem(MODES[cls], on ? '1' : '0');
  applyNative();
  layout();
}
$('b-theme').onclick = () => setMode('dark',    !body.classList.contains('dark'));
$('b-size').onclick  = () => setMode('compact', !body.classList.contains('compact'));
$('b-min').onclick   = () => setMode('min',     !body.classList.contains('min'));
$('b-quit').onclick  = () => send({cmd:'quit'});

// Tell the native shell which blur material to use behind the page.
function applyNative(){ send({cmd:'theme', dark:body.classList.contains('dark')}); }

/* ---------- unread: sessions that finished but you haven't opened yet ------
   Keyed by the finish timestamp, so the same session finishing again counts
   as new. Survives reloads; cleared by clicking the row, the banner, or the
   counter itself. ------------------------------------------------------- */
let lastData = null, seen = {};
try { seen = JSON.parse(localStorage.getItem('hudSeen') || '{}'); } catch(e){}
const saveSeen = () => localStorage.setItem('hudSeen', JSON.stringify(seen));
const isUnread = s => s.finishedAt != null && seen[s.sid] !== s.finishedAt;
function markRead(s){
  if (s && s.finishedAt != null) { seen[s.sid] = s.finishedAt; saveSeen(); }
}
$('badge').onclick = () => {
  (lastData ? lastData.sessions : []).forEach(markRead);
  if (lastData) render(lastData);
};

/* ---------- desktop notifications ------------------------------------------
   One notification per event, not per tick: keyed by the event's timestamp.
   Nothing that happened before this launch fires, so a restart stays quiet. */
const BOOT = Date.now();
let notified = {};
try { notified = JSON.parse(localStorage.getItem('hudNotified') || '{}'); } catch(e){}
function maybeNotify(list){
  let changed = false;
  for (const s of list) {
    const stamp = s.waitingAt || s.finishedAt;
    if (!stamp || stamp < BOOT) continue;
    if (notified[s.sid] === stamp) continue;
    notified[s.sid] = stamp;
    changed = true;
    send({cmd:'notify',
          title: s.waitingAt ? 'Waiting for you' : 'Finished',
          body:  s.name + (s.waitMsg ? ' — ' + s.waitMsg : ''),
          tty:   s.devtty});
    // Un-minimise and flash, so it lands even with notifications switched off.
    if (s.waitingAt) {
      if (body.classList.contains('min')) setMode('min', false);
      body.classList.remove('alerting');
      void body.offsetWidth;              // restart the animation
      body.classList.add('alerting');
      setTimeout(() => body.classList.remove('alerting'), 4500);
      send({cmd:'sound'});
    }
  }
  if (changed) localStorage.setItem('hudNotified', JSON.stringify(notified));
}

/* ---------- window dragging: anywhere that isn't a control ---------- */
document.addEventListener('mousedown', e => {
  if (e.target.closest('.row, .hd, .xbtn, #banner, #badge')) return;
  send({cmd:'drag'});
});
document.addEventListener('mouseup', () => send({cmd:'dragEnd'}));

/* ---------- collapsible sections ---------- */
for (const id of ['sec-s','sec-j']) {
  const el = $(id);
  if (localStorage.getItem(id) === 'closed') el.classList.add('closed');
  el.querySelector('.hd').onclick = () => {
    el.classList.toggle('closed');
    localStorage.setItem(id, el.classList.contains('closed') ? 'closed' : 'open');
    layout();
  };
}

/* ---------- formatting ---------- */
function dur(s){
  s = Math.max(0, Math.round(s));
  if (s < 60)    return s + 's';
  if (s < 3600)  return Math.round(s/60) + 'm';
  if (s < 86400) { const h = Math.floor(s/3600), m = Math.round(s%3600/60);
                   return m ? `${h}h ${m}m` : `${h}h`; }
  const d = Math.floor(s/86400), h = Math.round(s%86400/3600);
  return h ? `${d}d ${h}h` : `${d}d`;
}
const bytes = b => b == null ? ''
  : b >= 1e9 ? (b/1073741824).toFixed(1) + 'G'
  : Math.round(b/1048576) + 'M';
// Literal colours, set on the longhand property: WebKit will not resolve a
// var() assigned to the `background` shorthand from script.
const PAL = {
  light:{fail:'#c62828', busy:'#c26a00', done:'#12833f', calm:'rgba(0,0,0,.45)'},
  dark: {fail:'#ff6b6b', busy:'#ffb84d', done:'#3ddc84', calm:'rgba(255,255,255,.62)'}
};
const pal = () => PAL[body.classList.contains('dark') ? 'dark' : 'light'];
const loadColor  = p => { const c = pal();
  return p > 85 ? c.fail : p > 60 ? c.busy : c.done; };
const limitColor = p => { const c = pal();
  return p > 90 ? c.fail : p > 75 ? c.busy : c.calm; };

function meter(fillEl, valEl, pct, text, palette){
  if (pct == null || isNaN(pct)) { fillEl.style.width = '0'; valEl.textContent = '—'; return; }
  const p = Math.max(0, Math.min(100, pct));
  fillEl.style.width = p + '%';
  fillEl.style.backgroundColor = palette(p);
  valEl.innerHTML = text;
}

/* ---------- machine meters (pushed from native, off the collector tick) ---- */
let lastCPU = 0;
window.setMachine = (cpu, mem) => {
  lastCPU = cpu;
  meter($('f-cpu'), $('v-cpu'), cpu, `<em>${cpu.toFixed(0)}</em>%`, loadColor);
  meter($('f-mem'), $('v-mem'), mem, `<em>${mem.toFixed(0)}</em>%`, loadColor);
  if (body.classList.contains('min'))
    $('minstat').textContent = `CPU ${cpu.toFixed(0)}%`;
};

/* ---------- keyed row reconciler: no flicker, keeps hover ---------- */
function sync(container, items, key, paint){
  const seen = new Set();
  for (const it of items) {
    const k = key(it);
    seen.add(k);
    let row = container.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'row';
      row.dataset.k = k;
      container.appendChild(row);
    }
    paint(row, it);
  }
  for (const row of [...container.children])
    if (!seen.has(row.dataset.k)) row.remove();
  items.forEach((it, i) => {
    const row = container.querySelector(`[data-k="${CSS.escape(key(it))}"]`);
    if (row && container.children[i] !== row)
      container.insertBefore(row, container.children[i]);
  });
}

/* ---------- geometry ---------- */
let lastW = 0, lastH = 0;
function layout(){
  const w = body.classList.contains('compact') ? 284 : 360;
  const h = Math.ceil(body.getBoundingClientRect().height) + 2;
  if (w !== lastW || Math.abs(h - lastH) > 1) {
    lastW = w; lastH = h;
    send({cmd:'geometry', w, h});
  }
}

/* ---------- main render ---------- */
window.render = d => {
  lastData = d;
  const c = d.counts;
  // SVG elements need setAttribute — .className is a read-only SVGAnimatedString
  $('ch').setAttribute('class',
    'ch ' + (c.waiting ? 'wait' : c.busy ? 'work' : 'rest'));
  $('tally').innerHTML = c.waiting
    ? `<b class="wait">${c.waiting} waiting on you</b>`
    : c.busy ? `<b>${c.busy} running</b> · ${c.total - c.busy} idle`
    : `${c.total} idle`;

  /* running first, then anything unopened, then the rest */
  const rank = s => s.status === 'waiting' ? 0 : s.status === 'busy' ? 1
                  : isUnread(s) ? 2 : s.status === 'done' ? 3 : 4;
  const sessions = d.sessions.slice()
    .sort((a,b) => rank(a) - rank(b) || a.idleFor - b.idleFor);

  maybeNotify(sessions);

  const unread = sessions.filter(isUnread);
  $('badge').className = unread.length ? 'on' : '';
  $('badge').textContent = unread.length ? `${unread.length} NEW` : '';
  send({cmd:'badge', n:unread.length});

  /* the thing you actually want to see: what just finished */
  const fresh = sessions
    .filter(s => s.status === 'done' && s.finishedFor != null && s.finishedFor < 45)
    .sort((a,b) => a.finishedFor - b.finishedFor)[0];
  const ban = $('banner');
  if (fresh) {
    ban.classList.add('on');
    $('bwho').textContent = fresh.name;
    ban.onclick = () => {
      markRead(fresh);
      send({cmd:"focus", tty:fresh.devtty});
      render(d);
    };
  } else {
    ban.classList.remove('on');
    ban.onclick = null;
  }

  /* usage limits */
  const u = d.usage || {};
  const lim = (node, fillId, valId) => {
    if (!node || node.pct == null) {
      meter($(fillId), $(valId), null);
      // Keep it short — the value column is 78px wide.
      $(valId).textContent = !u.error ? '…'
        : u.error === 'loading' ? '…'
        : u.error === 'rate limited' ? 'throttled' : u.error;
      $(valId).title = u.error || '';
      return;
    }
    const left = node.resets ? (new Date(node.resets) - Date.now()) / 1000 : null;
    meter($(fillId), $(valId), node.pct,
          `<em>${Math.round(node.pct)}</em>% · ${left != null ? dur(left) : ''}`,
          limitColor);
    // Stale but real numbers beat a blank meter; flag it in the tooltip.
    $(valId).title = u.error ? `last known — ${u.error}` : '';
    $(valId).style.opacity = u.error ? '.55' : '';
  };
  lim(u.session, 'f-ses', 'v-ses');
  lim(u.weekly,  'f-wk',  'v-wk');
  if (u.scoped && !u.error)
    $('v-wk').title = `${u.scoped.label} weekly: ${u.scoped.pct}%`;

  /* sessions */
  $('sub-s').textContent = c.total
    ? `${c.total} · ${bytes(c.mem)}` : '';
  sync($('list-s'), sessions, s => 's' + s.sid, (row, s) => {
    const un = isUnread(s);
    row.className = 'row click ' + s.status + (un ? ' unread' : '') +
                    (s.mem > 5e8 ? ' heavy' : '');
    const meta = s.status === 'waiting'
      ? 'needs you'
      : s.status === 'busy'
      ? ((s.treeCpu != null ? s.treeCpu : s.cpu) >= 1
          ? Math.round(s.treeCpu != null ? s.treeCpu : s.cpu) + '%' : 'working')
      : s.finishedFor != null && (s.status === 'done' || un)
        ? '✓ ' + dur(s.finishedFor) + ' ago'
        : dur(s.idleFor);
    row.innerHTML = `<span class="st"></span><span class="nm"></span>` +
      `<span class="new">NEW</span>` +
      `<span class="meta mono">${meta}</span>` +
      `<span class="mem mono">${bytes(s.mem)}</span>`;
    row.querySelector('.nm').textContent = s.name;
    row.title = `${s.name}\npid ${s.pid} · ${s.devtty}\n` +
      `RAM ${bytes(s.mem)} (process tree) · CPU ${s.treeCpu}%\n` +
      `up ${s.uptime}\n${s.cwd}`;
    row.onclick = () => {
      markRead(s);
      send({cmd:"focus", tty:s.devtty});
      render(d);
    };
  });
  if (!sessions.length) $('list-s').innerHTML = '<div class="empty">no sessions</div>';

  /* background jobs */
  const jc = d.jobCounts;
  $('sub-j').innerHTML = `${jc.running} on` +
    (jc.failed ? ` · <span class="warn">${jc.failed} failed</span>` : '') +
    ` · ${jc.total}`;
  sync($('list-j'), d.jobs, j => 'j' + j.kind + j.label, (row, j) => {
    row.className = 'row ' + (j.failed ? 'fail' : j.running ? 'run' : '');
    let meta;
    if (j.running)     meta = j.sched === 'always on' ? 'on' : 'running';
    else if (j.failed) meta = 'exit ' + j.exit;
    else if (j.nextTs) meta = 'in ' + dur((j.nextTs - Date.now())/1000);
    else               meta = j.sched || '—';
    row.innerHTML = `<span class="st"></span><span class="nm"></span>` +
      `<span class="meta mono">${meta}</span>` +
      `<span class="tty mono">${j.kind === 'cron' ? 'cron' : ''}</span>`;
    row.querySelector('.nm').textContent = j.name;
    row.title = `${j.label}\n${j.sched || ''}`;
  });
  if (!d.jobs.length) $('list-j').innerHTML = '<div class="empty">no jobs</div>';

  layout();
};

window.__notifyReady = () => { applyNative(); send({cmd:'ready'}); layout(); };
window.__notifyReady();
</script>
</body>
</html>
